name: Publicar demonstração estática (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Validar sintaxe JavaScript
        run: |
          node --check shared/seed.js
          node --check app.js
          node --check admin.js
          node --check api/photo.js
          node --check api/upload.js
          node --check api/catalog.js
          node --check api/admin.js
          node --check lib/storage.js
      - name: Testar persistência e concorrência
        run: node --experimental-vm-modules --test tests/storage.test.mjs
      - name: Preparar arquivos públicos
        run: |
          mkdir -p _site/shared
          cp index.html admin.html styles.css admin.css app.js admin.js favicon.svg _site/
          cp shared/seed.js _site/shared/seed.js
          touch _site/.nojekyll
      - name: Empacotar para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
